<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Shop — Checkout</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
    body{background:#f5f5f5;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
    header{width:100%;max-width:800px;display:flex;justify-content:space-between;margin-bottom:40px}
    header h1{font-size:24px;color:#333}
    .checkout-container{background:white;border-radius:12px;padding:32px;max-width:600px;width:100%;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    .checkout-container h2{font-size:20px;color:#222;margin-bottom:24px;border-bottom:1px solid #eee;padding-bottom:12px}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:6px}
    .form-group input{width:100%;padding:12px 16px;border:1px solid #ddd;border-radius:8px;font-size:15px}
    .form-row{display:flex;gap:16px}
    .form-row .form-group{flex:1}
    #place-order{margin-top:8px;background:#2563eb;color:white;border:none;border-radius:8px;padding:14px 32px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
  </style>
</head>
<body>
  <header><h1>🛍️ MyShop</h1></header>
  <div class="checkout-container">
    <h2>💳 Checkout</h2>
    <form id="checkout-form">
      <div class="form-group"><label>Full Name</label><input type="text" placeholder="Jane Doe"/></div>
      <div class="form-group"><label>Email</label><input type="email" placeholder="jane@example.com"/></div>
      <div class="form-group"><label>Address</label><input type="text" placeholder="123 Main St"/></div>
      <div class="form-row">
        <div class="form-group"><label>Card Number</label><input type="text" placeholder="4242 4242 4242 4242"/></div>
        <div class="form-group"><label>Expiry</label><input type="text" placeholder="MM/YY"/></div>
      </div>
      <button type="submit" id="place-order">Place Order</button>
    </form>
  </div>
  <script>
    document.getElementById("checkout-form").addEventListener("submit", e => {
      e.preventDefault();
      alert("Order placed! Thank you 🎉");
    });
  </script>
</body>
</html>
