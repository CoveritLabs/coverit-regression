name: CoverIt Regression

on:
  workflow_dispatch:
    inputs:
      featureRegex:
        description: Feature name or feature file regex
        required: false
        type: string
      scenarioRegex:
        description: Scenario name regex
        required: false
        type: string
      marks:
        description: Comma-separated marks, for example @checkout,@smoke
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      CI: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './package.json'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run manual filters
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:filtered
        env:
          FEATURE_REGEX: ${{ inputs.featureRegex }}
          SCENARIO_REGEX: ${{ inputs.scenarioRegex }}
          MARKS: ${{ inputs.marks }}
          COVERIT_API_REPORTING_ENABLED: ${{ vars.COVERIT_API_REPORTING_ENABLED }}
          COVERIT_API_BASE_URL: ${{ vars.COVERIT_API_BASE_URL }}
          COVERIT_API_KEY: ${{ secrets.COVERIT_API_KEY }}

      - name: Run added flows
        if: github.event_name == 'pull_request'
        run: npm run ci:added-flows
        env:
          COVERIT_BASE_REF: ${{ github.base_ref || github.ref_name }}
          COVERIT_API_REPORTING_ENABLED: ${{ vars.COVERIT_API_REPORTING_ENABLED }}
          COVERIT_API_BASE_URL: ${{ vars.COVERIT_API_BASE_URL }}
          COVERIT_API_KEY: ${{ secrets.COVERIT_API_KEY }}
